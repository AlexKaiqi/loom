schema_version = 2

[harness]
path = 'harness'
argv = ['python3', '-I', '{harness}/worker.py']
[surface]
path = 'surface'

# Portable, non-secret Work requirements. Edit before `loom create --definition`.
# Runtime fixes this declaration's digest when creating the Work.
[model]
service = "primary"

# Native Pi model semantics. The named host service supplies baseUrl and keys.
[model.parameters]
id = "your-model-id"
name = "Configured model"
api = "openai-completions"
provider = "configured"
reasoning = false
input = ["text", "image"]
contextWindow = 128000
maxTokens = 8192
[model.parameters.cost]
input = 0
output = 0
cacheRead = 0
cacheWrite = 0

[userspaces.app]
resource = "task-files"
access = "write"
delivery = "per-tool"

[targets.default]
profile = "code"
userspaces = ["app"]
